name: CI (Lint & Test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck client & server
        run: |
          npm run typecheck --if-present

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_at_least_32_characters_long
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindrise_test
